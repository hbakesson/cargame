<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Hakan's Carpool</title>
<style>
  :root {
    --ui-fg: #f4f7fb;
    --ui-dim: rgba(244, 247, 251, 0.62);
    --ui-panel: rgba(12, 18, 28, 0.42);
    --ui-border: rgba(255, 255, 255, 0.16);
  }

  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #8ec5e8;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: var(--ui-fg);
  }

  canvas { display: block; }

  .panel {
    position: fixed;
    padding: 14px 18px 16px;
    border-radius: 14px;
    background: var(--ui-panel);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid var(--ui-border);
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.18);
    user-select: none;
    pointer-events: none;
  }

  .label {
    font-size: 11px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--ui-dim);
  }

  /* ---- Speed (top-left) ---- */
  #hud { top: 18px; left: 18px; min-width: 168px; }

  #speed-value {
    font-variant-numeric: tabular-nums;
    font-size: 44px;
    font-weight: 650;
    line-height: 1.05;
    margin-top: 2px;
  }

  #speed-value small {
    font-size: 15px;
    font-weight: 500;
    color: var(--ui-dim);
    margin-left: 4px;
  }

  #speed-bar {
    margin-top: 10px;
    height: 6px;
    border-radius: 3px;
    background: rgba(255, 255, 255, 0.18);
    overflow: hidden;
  }

  #speed-bar-fill {
    height: 100%;
    width: 0%;
    border-radius: 3px;
    background: linear-gradient(90deg, #6ee7a8, #ffd76e 65%, #ff7a6b);
    transition: width 0.06s linear;
  }

  #gear {
    margin-top: 8px;
    font-size: 12px;
    color: var(--ui-dim);
    letter-spacing: 0.08em;
  }

  /* ---- Score (top-right) ---- */
  #score-panel { top: 18px; right: 18px; min-width: 150px; text-align: right; }

  #score-value {
    font-variant-numeric: tabular-nums;
    font-size: 34px;
    font-weight: 650;
    line-height: 1.1;
    margin-top: 2px;
  }

  #best-value {
    margin-top: 6px;
    font-size: 12px;
    color: var(--ui-dim);
    font-variant-numeric: tabular-nums;
  }

  /* ---- Near-miss popup ---- */
  #nearmiss {
    position: fixed;
    top: 44%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 26px;
    font-weight: 700;
    letter-spacing: 0.05em;
    color: #ffe37a;
    text-shadow: 0 2px 18px rgba(0, 0, 0, 0.45);
    opacity: 0;
    user-select: none;
    pointer-events: none;
  }

  #nearmiss.show { animation: pop 0.85s ease-out; }

  @keyframes pop {
    0%   { opacity: 0; transform: translate(-50%, -40%) scale(0.85); }
    18%  { opacity: 1; transform: translate(-50%, -50%) scale(1.06); }
    100% { opacity: 0; transform: translate(-50%, -72%) scale(1); }
  }

  /* ---- Crash vignette ---- */
  #vignette {
    position: fixed;
    inset: 0;
    pointer-events: none;
    opacity: 0;
    background: radial-gradient(ellipse at center, rgba(255, 40, 30, 0) 35%, rgba(190, 20, 15, 0.85) 100%);
    transition: opacity 0.25s ease-out;
  }

  #vignette.show { opacity: 1; }

  /* ---- Game over ---- */
  #gameover {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    background: rgba(8, 12, 20, 0.55);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.35s ease;
    user-select: none;
  }

  #gameover.show { opacity: 1; }

  #gameover h1 {
    margin: 0;
    font-size: 52px;
    font-weight: 700;
    letter-spacing: -0.02em;
  }

  #final-score {
    font-size: 20px;
    font-variant-numeric: tabular-nums;
  }

  #final-best { font-size: 14px; color: var(--ui-dim); font-variant-numeric: tabular-nums; }

  #new-best {
    margin-top: 4px;
    font-size: 14px;
    font-weight: 700;
    color: #ffe37a;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    display: none;
  }

  #restart-hint { margin-top: 18px; font-size: 14px; color: var(--ui-dim); }

  /* ---- Start title ---- */
  #title {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    pointer-events: none;
    user-select: none;
    transition: opacity 0.8s ease;
  }

  #title.fade { opacity: 0; }

  #title h1 {
    margin: 0;
    font-size: clamp(38px, 9vw, 92px);
    font-weight: 750;
    letter-spacing: -0.03em;
    text-shadow: 0 6px 34px rgba(0, 0, 0, 0.45);
  }

  #title p {
    margin: 0;
    font-size: 15px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: rgba(255, 255, 255, 0.85);
    text-shadow: 0 2px 14px rgba(0, 0, 0, 0.5);
    animation: blink 1.6s ease-in-out infinite;
  }

  @keyframes blink {
    0%, 100% { opacity: 0.45; }
    50%      { opacity: 1; }
  }

  /* ---- Controls hint ---- */
  #hint {
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    padding: 10px 16px;
    border-radius: 12px;
    font-size: 13px;
    color: var(--ui-dim);
    transition: opacity 0.6s ease;
  }

  #hint.fade { opacity: 0; }

  kbd {
    display: inline-block;
    padding: 2px 7px;
    margin: 0 2px;
    border-radius: 6px;
    background: rgba(255, 255, 255, 0.16);
    border: 1px solid rgba(255, 255, 255, 0.22);
    border-bottom-width: 2px;
    color: var(--ui-fg);
    font: inherit;
    font-size: 12px;
    font-weight: 600;
  }

  #muted-tag {
    position: fixed;
    bottom: 20px;
    right: 20px;
    font-size: 12px;
    color: var(--ui-dim);
    user-select: none;
    pointer-events: none;
    display: none;
  }
</style>
</head>
<body>

<div id="hud" class="panel">
  <div class="label">Speed</div>
  <div id="speed-value"><span id="speed-number">0</span><small>km/h</small></div>
  <div id="speed-bar"><div id="speed-bar-fill"></div></div>
  <div id="gear">GEAR <span id="gear-number">1</span></div>
</div>

<div id="score-panel" class="panel">
  <div class="label">Score</div>
  <div id="score-value">0</div>
  <div id="best-value">Best 0</div>
</div>

<div id="nearmiss">NEAR MISS +75</div>
<div id="vignette"></div>

<div id="gameover">
  <h1>CRASHED</h1>
  <div id="final-score">Score 0</div>
  <div id="final-best">Best 0</div>
  <div id="new-best">New best!</div>
  <div id="restart-hint">Press <kbd>SPACE</kbd> or <kbd>R</kbd> to drive again</div>
</div>

<div id="title">
  <h1>Hakan's Carpool</h1>
  <p id="title-hint">Press any key to start</p>
</div>

<div id="hint" class="panel">
  <kbd>SPACE</kbd> accelerate &nbsp;·&nbsp; <kbd>M</kbd> brake / reverse &nbsp;·&nbsp;
  <kbd>A</kbd> left &nbsp;·&nbsp; <kbd>D</kbd> right &nbsp;·&nbsp; <kbd>N</kbd> mute
</div>

<div id="muted-tag">MUTED</div>

<!-- Three.js as an ES module from CDN (no game engine, no physics library) -->
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
  }
}
</script>

<script type="module">
import * as THREE from 'three';

/* =========================================================================
   CONFIG — tune these to change how the game feels
   ========================================================================= */
const CONFIG = {
  // --- Road layout ---
  laneCount:      3,
  laneWidth:      4,
  segmentLength:  25,     // shorter chunks keep curved joints tight
  segmentCount:   26,     // 650 units of road alive at once
  behindCamera:   60,     // how much road is kept behind the car

  // --- Longitudinal physics ---
  maxSpeed:       62,     // units/second (~223 km/h)
  acceleration:   17,     // units/second² on the throttle
  friction:       8,      // constant rolling deceleration when coasting
  airDrag:        0.16,   // extra deceleration proportional to speed
  brakeForce:     34,     // deceleration while braking
  reverseAccel:   9,
  maxReverseSpeed: 9,
  attractSpeed:   17,     // gentle cruise behind the title screen

  // --- Lane-change steering ---
  // A and D pick a lane; the car slides across on its own.
  laneChangeRate:     6.5,   // how briskly the car crosses (higher = snappier)
  laneChangeMinSpeed: 0.12,  // speed fraction needed for a full-rate lane change
  maxHeading:         0.5,   // radians — visual yaw cap while crossing
  curveDrift:         0.35,  // how hard corners push the car wide in its lane

  wheelRadius:    0.42,

  // --- Chase camera ---
  camHeight:      4.2,
  camDistance:    9.6,
  camLookAhead:  -10,
  camLerp:        4.5,
  camLateralLag:  2.2,    // lower = camera trails harder through turns
  baseFov:        62,

  // --- Traffic ---
  trafficCount:    9,
  trafficMinSpeed: 13,
  trafficMaxSpeed: 34,
  spawnMin:        170,   // respawn distance ahead of the player
  spawnMax:        640,

  // --- Scoring ---
  pointsPerUnit:   0.55,  // base score rate per unit travelled
  nearMissDist:    4.6,   // one lane over — sized for lane-to-lane passes
  nearMissBonus:   75,

  // --- Look ---
  skyColor:       0x8ec5e8,
  fogNear:        130,
  fogFar:         430,
};

// Derived road measurements
const ROAD_WIDTH     = CONFIG.laneCount * CONFIG.laneWidth;   // 12
const ROAD_HALF      = ROAD_WIDTH / 2;
const SHOULDER       = 1.6;
const TOTAL_ROAD_LEN = CONFIG.segmentCount * CONFIG.segmentLength;
const LANE_X = Array.from(
  { length: CONFIG.laneCount },
  (_, i) => -ROAD_HALF + (i + 0.5) * CONFIG.laneWidth
);

// Collision half-extents (car is 2.0 wide, 4.4 long)
const CAR_HALF_W = 1.0;
const CAR_HALF_L = 2.2;

/* =========================================================================
   STATE
   ========================================================================= */
let renderer, scene, camera, clock;
let worldGroup;                       // holds everything that curves with the road
let car, frontLeftPivot, frontRightPivot, playerWheels = [];
let roadSegments = [];
let traffic = [];
let speedLines, speedLineData = [];

// Car physics state
const physics = {
  currentSpeed: 0,   // signed: negative = reversing
  heading:      0,   // radians, derived from the slide — used for visuals only
  x:            0,   // lateral position, in road-local coordinates
  targetLane:   1,   // the lane the car is heading for (starts in the middle)
  lateralVel:   0,   // sideways velocity, measured per frame
  wheelSpin:    0,
};

// Game state
const game = {
  state:      'title',     // 'title' | 'driving' | 'crashing' | 'over'
  distance:   0,           // road distance travelled (drives the whole world)
  score:      0,
  best:       Number(localStorage.getItem('endlessDriveBest') || 0),
  timeScale:  1,
  crashTimer: 0,
  shake:      0,
  awaitingRestartRelease: false,
};

const keys = { accelerate: false, brake: false };
let muted = false;

// Reusable temporaries so the loop allocates nothing
const _camTarget  = new THREE.Vector3();
const _lookTarget = new THREE.Vector3();
let camLateral = 0;

// HUD elements
const ui = {
  speedNumber: document.getElementById('speed-number'),
  speedFill:   document.getElementById('speed-bar-fill'),
  gearNumber:  document.getElementById('gear-number'),
  score:       document.getElementById('score-value'),
  best:        document.getElementById('best-value'),
  nearmiss:    document.getElementById('nearmiss'),
  vignette:    document.getElementById('vignette'),
  gameover:    document.getElementById('gameover'),
  finalScore:  document.getElementById('final-score'),
  finalBest:   document.getElementById('final-best'),
  newBest:     document.getElementById('new-best'),
  title:       document.getElementById('title'),
  titleHint:   document.getElementById('title-hint'),
  hint:        document.getElementById('hint'),
  mutedTag:    document.getElementById('muted-tag'),
};
let lastKmh = -1, lastScore = -1, lastGear = -1;   // avoid needless DOM writes

/* =========================================================================
   SHARED MATERIALS / GEOMETRY — built once, reused everywhere
   ========================================================================= */
const MATERIALS = {
  road:      new THREE.MeshStandardMaterial({ color: 0x3b4048, roughness: 0.95 }),
  shoulder:  new THREE.MeshStandardMaterial({ color: 0x2f343b, roughness: 1.0 }),
  grass:     new THREE.MeshStandardMaterial({ color: 0x6faa5e, roughness: 1.0 }),
  grassDark: new THREE.MeshStandardMaterial({ color: 0x5f9a51, roughness: 1.0 }),
  lineWhite: new THREE.MeshStandardMaterial({ color: 0xf2f4f0, roughness: 0.7 }),
  trunk:     new THREE.MeshStandardMaterial({ color: 0x6b4b32, roughness: 1.0 }),
  leaves:    new THREE.MeshStandardMaterial({ color: 0x3f7f45, roughness: 1.0, flatShading: true }),
  leavesAlt: new THREE.MeshStandardMaterial({ color: 0x4f8f3f, roughness: 1.0, flatShading: true }),
  rock:      new THREE.MeshStandardMaterial({ color: 0x8b8d90, roughness: 1.0, flatShading: true }),
  signPost:  new THREE.MeshStandardMaterial({ color: 0xb8bcc2, roughness: 0.6, metalness: 0.3 }),
  signFace:  new THREE.MeshStandardMaterial({ color: 0xf0c419, roughness: 0.6 }),
  signFace2: new THREE.MeshStandardMaterial({ color: 0x3d7de0, roughness: 0.6 }),
  streak:    new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0 }),
};

const GEOMETRY = {
  dash:     new THREE.PlaneGeometry(0.22, 3),
  edgeLine: new THREE.PlaneGeometry(0.18, CONFIG.segmentLength * 1.02),
  trunk:    new THREE.CylinderGeometry(0.18, 0.26, 2.2, 6),
  cone:     new THREE.ConeGeometry(1.35, 3.2, 7),
  rock:     new THREE.DodecahedronGeometry(0.6, 0),
  post:     new THREE.BoxGeometry(0.12, 2.4, 0.12),
  panel:    new THREE.BoxGeometry(1.5, 1.0, 0.09),
  patch:    new THREE.CircleGeometry(3.2, 8),
};

// Traffic paint jobs
const TRAFFIC_COLORS = [0x3d7de0, 0xf0c419, 0x2fae7a, 0xe2e5ea, 0x8a5cf0, 0xef7d3a, 0x53585f];

/* =========================================================================
   ROAD CURVE
   =========================================================================
   The centerline is a smooth function of distance travelled. Segments are
   placed along it and the whole world is counter-rotated at the player, so
   the road under the car always runs straight ahead while the road in the
   distance sweeps left and right.
   ========================================================================= */
const CURVE = [
  { amp: 55, freq: 0.0016,  phase: 0    },
  { amp: 90, freq: 0.00047, phase: 1.7  },
];

function curveX(d) {
  let x = 0;
  for (const c of CURVE) x += Math.sin(d * c.freq + c.phase) * c.amp;
  return x;
}

/** First derivative — the road's local heading. */
function curveSlope(d) {
  let s = 0;
  for (const c of CURVE) s += Math.cos(d * c.freq + c.phase) * c.amp * c.freq;
  return s;
}

/** Second derivative — how tight the corner is (drives centrifugal drift). */
function curveBend(d) {
  let b = 0;
  for (const c of CURVE) b -= Math.sin(d * c.freq + c.phase) * c.amp * c.freq * c.freq;
  return b;
}

/* =========================================================================
   init()
   ========================================================================= */
function init() {
  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.05;
  document.body.appendChild(renderer.domElement);

  scene = new THREE.Scene();
  scene.background = new THREE.Color(CONFIG.skyColor);
  scene.fog = new THREE.Fog(CONFIG.skyColor, CONFIG.fogNear, CONFIG.fogFar);

  camera = new THREE.PerspectiveCamera(CONFIG.baseFov, window.innerWidth / window.innerHeight, 0.1, 800);
  camera.position.set(0, CONFIG.camHeight, CONFIG.camDistance);

  clock = new THREE.Clock();

  worldGroup = new THREE.Group();
  scene.add(worldGroup);

  createLights();
  createRoad();
  createCar();
  createTraffic();
  createSpeedLines();

  updateWorld();          // place everything before the first frame
  updateScoreHUD(true);

  window.addEventListener('resize', onResize);
  window.addEventListener('keydown', onKeyDown);
  window.addEventListener('keyup', onKeyUp);

  // A click counts as a gesture too, and only wakes the music — it never
  // starts the game, so you can hear the tune before driving.
  window.addEventListener('pointerdown', wakeAudio);

  // If this page is already allowed to make noise, start the tune right away.
  initAudio();
  if (audio) {
    audio.ctx.resume().then(() => {
      if (audio.ctx.state === 'running' && !musicStarted && game.state === 'title') {
        musicStarted = true;
        startMusic();
        ui.titleHint.textContent = 'Press any key to drive';
      }
    }).catch(() => { /* blocked until the first gesture — expected */ });
  }
}

/* -------------------------------------------------------------------------
   Lighting: directional "sun" for shadows + hemisphere ambient for fill
   ------------------------------------------------------------------------- */
function createLights() {
  scene.add(new THREE.HemisphereLight(0xbfe3ff, 0x5c7a4a, 0.85));

  const sun = new THREE.DirectionalLight(0xfff3dd, 2.1);
  sun.position.set(-40, 55, 25);
  sun.castShadow = true;

  // The car stays near the origin, so one fixed shadow camera covers the
  // whole play area for the entire game.
  const s = 55;
  sun.shadow.mapSize.set(2048, 2048);
  sun.shadow.camera.left   = -s;
  sun.shadow.camera.right  =  s;
  sun.shadow.camera.top    =  s;
  sun.shadow.camera.bottom = -s;
  sun.shadow.camera.near = 1;
  sun.shadow.camera.far  = 160;
  sun.shadow.bias = -0.0008;
  sun.shadow.normalBias = 0.02;

  scene.add(sun);
  scene.add(sun.target);
}

/* =========================================================================
   createRoad() — grass ground plus a pool of recycled road segments
   ========================================================================= */
function createRoad() {
  // Grass on both sides. It is featureless, so it never needs to move.
  const grass = new THREE.Mesh(new THREE.PlaneGeometry(1400, 1800), MATERIALS.grass);
  grass.rotation.x = -Math.PI / 2;
  grass.position.set(0, -0.02, -600);
  grass.receiveShadow = true;
  scene.add(grass);

  for (let i = 0; i < CONFIG.segmentCount; i++) {
    const segment = createRoadSegment();
    segment.userData.roadDist = i * CONFIG.segmentLength - CONFIG.behindCamera;
    randomizeSegment(segment);
    worldGroup.add(segment);
    roadSegments.push(segment);
  }
}

/**
 * Builds one road chunk plus a fixed pool of scenery objects. The props are
 * created once here and only re-randomized on recycle — the game never
 * allocates geometry while driving.
 */
function createRoadSegment() {
  const len = CONFIG.segmentLength;
  const group = new THREE.Group();

  // Asphalt, very slightly overlong so curved joints never show a gap
  const asphalt = new THREE.Mesh(
    new THREE.PlaneGeometry(ROAD_WIDTH + SHOULDER * 2, len * 1.04),
    MATERIALS.road
  );
  asphalt.rotation.x = -Math.PI / 2;
  asphalt.receiveShadow = true;
  group.add(asphalt);

  for (const side of [-1, 1]) {
    const shoulder = new THREE.Mesh(new THREE.PlaneGeometry(SHOULDER, len * 1.04), MATERIALS.shoulder);
    shoulder.rotation.x = -Math.PI / 2;
    shoulder.position.set(side * (ROAD_HALF + SHOULDER / 2), 0.005, 0);
    shoulder.receiveShadow = true;
    group.add(shoulder);

    const edge = new THREE.Mesh(GEOMETRY.edgeLine, MATERIALS.lineWhite);
    edge.rotation.x = -Math.PI / 2;
    edge.position.set(side * (ROAD_HALF - 0.18), 0.012, 0);
    group.add(edge);
  }

  // Dashed lane dividers
  const dashPeriod = 8;
  const dashes = Math.max(1, Math.round(len / dashPeriod));
  for (let lane = 1; lane < CONFIG.laneCount; lane++) {
    const x = -ROAD_HALF + lane * CONFIG.laneWidth;
    for (let d = 0; d < dashes; d++) {
      const dash = new THREE.Mesh(GEOMETRY.dash, MATERIALS.lineWhite);
      dash.rotation.x = -Math.PI / 2;
      dash.position.set(x, 0.012, -len / 2 + (len / dashes) * (d + 0.5));
      group.add(dash);
    }
  }

  // --- Scenery pool (created once, reshuffled forever) ---
  const props = new THREE.Group();
  props.name = 'props';
  group.add(props);

  const pool = { trees: [], rocks: [], patches: [], sign: null };
  for (let i = 0; i < 4; i++) { const t = makeTree();  props.add(t); pool.trees.push(t); }
  for (let i = 0; i < 2; i++) { const r = makeRock();  props.add(r); pool.rocks.push(r); }
  for (let i = 0; i < 2; i++) { const p = makePatch(); props.add(p); pool.patches.push(p); }
  pool.sign = makeSign(); props.add(pool.sign);

  group.userData.pool = pool;
  return group;
}

/** Re-rolls a segment's scenery. Pure transform updates — no allocation. */
function randomizeSegment(segment) {
  const pool = segment.userData.pool;
  const len  = CONFIG.segmentLength;
  const edge = ROAD_HALF + SHOULDER;

  for (const patch of pool.patches) {
    patch.position.set(randSide() * (edge + rand(2, 40)), 0.0, rand(-len / 2, len / 2));
    patch.scale.setScalar(rand(0.6, 1.6));
  }

  const treeCount = Math.round(rand(1.6, 4.4));   // some segments stay sparse
  pool.trees.forEach((tree, i) => {
    tree.visible = i < treeCount;
    if (!tree.visible) return;
    tree.position.set(randSide() * (edge + rand(3, 48)), 0, rand(-len / 2, len / 2));
    tree.rotation.y = rand(0, Math.PI * 2);
    tree.scale.setScalar(rand(0.75, 1.45));
  });

  const rockCount = Math.round(rand(0, 2));
  pool.rocks.forEach((rock, i) => {
    rock.visible = i < rockCount;
    if (!rock.visible) return;
    rock.position.set(randSide() * (edge + rand(1.2, 12)), rand(0.15, 0.35), rand(-len / 2, len / 2));
    rock.rotation.set(rand(0, 3), rand(0, 3), rand(0, 3));
    rock.scale.set(rand(0.6, 1.5), rand(0.5, 1.0), rand(0.6, 1.5));
  });

  const sign = pool.sign;
  sign.visible = Math.random() < 0.35;
  if (sign.visible) {
    const x = randSide() * (edge + rand(1.0, 2.4));
    sign.position.set(x, 0, rand(-len / 2, len / 2));
    sign.rotation.y = (x > 0 ? -1 : 1) * 0.28;
    sign.children[1].material = Math.random() < 0.5 ? MATERIALS.signFace : MATERIALS.signFace2;
  }
}

function makeTree() {
  const tree = new THREE.Group();

  const trunk = new THREE.Mesh(GEOMETRY.trunk, MATERIALS.trunk);
  trunk.position.y = 1.1;
  trunk.castShadow = true;
  tree.add(trunk);

  // Two stacked cones give a cheap but pleasant conifer silhouette
  const mat = Math.random() < 0.5 ? MATERIALS.leaves : MATERIALS.leavesAlt;

  const lower = new THREE.Mesh(GEOMETRY.cone, mat);
  lower.position.y = 3.0;
  lower.castShadow = true;
  tree.add(lower);

  const upper = new THREE.Mesh(GEOMETRY.cone, mat);
  upper.position.y = 4.5;
  upper.scale.setScalar(0.7);
  upper.castShadow = true;
  tree.add(upper);

  return tree;
}

function makeRock() {
  const rock = new THREE.Mesh(GEOMETRY.rock, MATERIALS.rock);
  rock.castShadow = true;
  return rock;
}

function makePatch() {
  const patch = new THREE.Mesh(GEOMETRY.patch, MATERIALS.grassDark);
  patch.rotation.x = -Math.PI / 2;
  return patch;
}

function makeSign() {
  const sign = new THREE.Group();

  const post = new THREE.Mesh(GEOMETRY.post, MATERIALS.signPost);
  post.position.y = 1.2;
  post.castShadow = true;
  sign.add(post);

  const panel = new THREE.Mesh(GEOMETRY.panel, MATERIALS.signFace);
  panel.position.y = 2.1;
  panel.castShadow = true;
  sign.add(panel);       // index 1 — swapped in randomizeSegment()

  return sign;
}

/* =========================================================================
   CARS — one builder used for the player and for traffic
   ========================================================================= */
/**
 * Assembles a car from primitives. Traffic uses `simple` to skip the glass
 * and rims, which keeps the draw call count reasonable.
 */
function buildCar(bodyColor, simple = false) {
  const group = new THREE.Group();
  const wheels = [];

  const dark = new THREE.Color(bodyColor).multiplyScalar(0.78).getHex();
  const bodyMat  = new THREE.MeshStandardMaterial({ color: bodyColor, roughness: 0.35, metalness: 0.35 });
  const cabinMat = new THREE.MeshStandardMaterial({ color: dark, roughness: 0.35, metalness: 0.35 });
  const glassMat = new THREE.MeshStandardMaterial({ color: 0x1e2a38, roughness: 0.1, metalness: 0.6 });
  const tireMat  = new THREE.MeshStandardMaterial({ color: 0x1b1c1f, roughness: 0.9 });
  const rimMat   = new THREE.MeshStandardMaterial({ color: 0xd6d9de, roughness: 0.3, metalness: 0.8 });
  const lightMat = new THREE.MeshStandardMaterial({ color: 0xfff2c4, emissive: 0xffe9a8, emissiveIntensity: 0.8 });
  const brakeMat = new THREE.MeshStandardMaterial({ color: 0xff4433, emissive: 0x992018, emissiveIntensity: 0.6 });

  // Lower body
  const body = new THREE.Mesh(new THREE.BoxGeometry(2.0, 0.55, 4.4), bodyMat);
  body.position.y = 0.62;
  body.castShadow = true;
  group.add(body);

  // Cabin
  const cabin = new THREE.Mesh(new THREE.BoxGeometry(1.7, 0.6, 1.9), cabinMat);
  cabin.position.set(0, 1.32, 0.25);
  cabin.castShadow = true;
  group.add(cabin);

  if (!simple) {
    // Hood/trunk deck, a touch narrower for a chamfered look
    const deck = new THREE.Mesh(new THREE.BoxGeometry(1.86, 0.22, 4.0), bodyMat);
    deck.position.y = 0.96;
    deck.castShadow = true;
    group.add(deck);

    const windscreen = new THREE.Mesh(new THREE.BoxGeometry(1.56, 0.5, 0.1), glassMat);
    windscreen.position.set(0, 1.34, -0.68);
    windscreen.rotation.x = -0.32;
    group.add(windscreen);

    const rearGlass = new THREE.Mesh(new THREE.BoxGeometry(1.56, 0.46, 0.1), glassMat);
    rearGlass.position.set(0, 1.34, 1.18);
    rearGlass.rotation.x = 0.34;
    group.add(rearGlass);

    for (const side of [-1, 1]) {
      const sideGlass = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.4, 1.6), glassMat);
      sideGlass.position.set(side * 0.86, 1.34, 0.25);
      group.add(sideGlass);

      const head = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.16, 0.1), lightMat);
      head.position.set(side * 0.62, 0.74, -2.2);
      group.add(head);
    }
  }

  // Tail lights (kept on traffic too — they read well from behind)
  for (const side of [-1, 1]) {
    const tail = new THREE.Mesh(new THREE.BoxGeometry(0.42, 0.14, 0.1), brakeMat);
    tail.position.set(side * 0.68, 0.78, 2.2);
    group.add(tail);
  }

  // Wheels. Geometry is pre-rotated so the cylinder axis runs along X; each
  // wheel then sits in a pivot group, so steering (pivot yaw) and rolling
  // (mesh spin) never fight each other.
  const tireGeo = new THREE.CylinderGeometry(CONFIG.wheelRadius, CONFIG.wheelRadius, 0.34, simple ? 10 : 18);
  tireGeo.rotateZ(Math.PI / 2);
  const rimGeo = new THREE.CylinderGeometry(CONFIG.wheelRadius * 0.55, CONFIG.wheelRadius * 0.55, 0.36, 10);
  rimGeo.rotateZ(Math.PI / 2);

  const specs = [
    { x: -1.02, z: -1.45, front: true  },
    { x:  1.02, z: -1.45, front: true  },
    { x: -1.02, z:  1.50, front: false },
    { x:  1.02, z:  1.50, front: false },
  ];

  let frontLeft = null, frontRight = null;
  for (const spec of specs) {
    const pivot = new THREE.Group();
    pivot.position.set(spec.x, CONFIG.wheelRadius, spec.z);

    const tire = new THREE.Mesh(tireGeo, tireMat);
    tire.castShadow = true;
    if (!simple) tire.add(new THREE.Mesh(rimGeo, rimMat));

    pivot.add(tire);
    group.add(pivot);
    wheels.push(tire);

    if (spec.front) {
      if (spec.x < 0) frontLeft = pivot; else frontRight = pivot;
    }
  }

  return { group, wheels, frontLeft, frontRight };
}

/** createCar() — the player's car, parked at the world origin forever. */
function createCar() {
  const built = buildCar(0xd8383c, false);
  car = built.group;
  playerWheels = built.wheels;
  frontLeftPivot = built.frontLeft;
  frontRightPivot = built.frontRight;
  scene.add(car);        // deliberately NOT in worldGroup — the world moves, not the car
}

/* =========================================================================
   TRAFFIC — slower cars to weave through; the game's only fail state
   ========================================================================= */
function createTraffic() {
  for (let i = 0; i < CONFIG.trafficCount; i++) {
    const color = TRAFFIC_COLORS[i % TRAFFIC_COLORS.length];
    const built = buildCar(color, true);
    built.group.visible = false;      // the road stays empty behind the title
    worldGroup.add(built.group);

    const entry = {
      group: built.group,
      wheels: built.wheels,
      roadDist: 0,
      lane: 0,
      laneX: 0,
      speed: 0,
      scored: false,
    };
    traffic.push(entry);
    respawnTraffic(entry, true);
  }
}

/** Places a traffic car somewhere ahead, never sealing off every lane. */
function respawnTraffic(entry, initial = false) {
  const minAhead = initial ? 90 : CONFIG.spawnMin;

  for (let attempt = 0; attempt < 14; attempt++) {
    const d = game.distance + rand(minAhead, CONFIG.spawnMax);
    const lane = Math.floor(Math.random() * CONFIG.laneCount);
    if (isSpotFree(entry, d, lane)) {
      entry.roadDist = d;
      entry.lane = lane;
      entry.laneX = LANE_X[lane] + rand(-0.5, 0.5);
      entry.speed = rand(CONFIG.trafficMinSpeed, CONFIG.trafficMaxSpeed);
      entry.scored = false;
      return;
    }
  }

  // Fallback: park it far away and try again next frame
  entry.roadDist = game.distance + CONFIG.spawnMax;
  entry.lane = 1;
  entry.laneX = LANE_X[1];
  entry.speed = CONFIG.trafficMaxSpeed;
  entry.scored = false;
}

/**
 * A spot is free if no car already sits there, and taking it still leaves at
 * least one lane open across that stretch of road — so there is always a way
 * through.
 */
function isSpotFree(self, d, lane) {
  const blocked = new Set([lane]);

  for (const other of traffic) {
    if (other === self) continue;
    if (Math.abs(other.roadDist - d) < 45) {
      if (other.lane === lane) return false;
      blocked.add(other.lane);
    }
  }
  return blocked.size < CONFIG.laneCount;
}

function updateTraffic(dt) {
  for (const t of traffic) {
    t.roadDist += t.speed * dt;

    const rel = t.roadDist - game.distance;

    // Recycle once passed (or left far behind if the player reversed)
    if (rel < -70 || rel > CONFIG.spawnMax + 260) {
      respawnTraffic(t);
      continue;
    }

    // Spin the wheels at their own speed
    for (const wheel of t.wheels) wheel.rotation.x -= (t.speed * dt) / CONFIG.wheelRadius;
  }
}

/* -------------------------------------------------------------------------
   Collisions and near misses, both in flat road-local coordinates.
   ------------------------------------------------------------------------- */
function checkCollisions() {
  if (game.state !== 'driving') return;

  for (const t of traffic) {
    const dz = t.roadDist - game.distance;
    if (Math.abs(dz) > 12) continue;

    const dx = t.laneX - physics.x;

    // Overlap on both axes = crash
    if (Math.abs(dx) < CAR_HALF_W * 2 && Math.abs(dz) < CAR_HALF_L * 2) {
      crash();
      return;
    }

    // Squeezed past close alongside = near miss bonus, once per car
    if (!t.scored && Math.abs(dz) < 2.5 &&
        Math.abs(dx) >= CAR_HALF_W * 2 && Math.abs(dx) < CONFIG.nearMissDist) {
      t.scored = true;
      game.score += CONFIG.nearMissBonus;
      flashNearMiss();
    }
  }
}

/* =========================================================================
   SPEED LINES — cheap streaks that only appear when really moving
   ========================================================================= */
function createSpeedLines() {
  const count = 70;
  const positions = new Float32Array(count * 6);   // two endpoints per streak
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));

  for (let i = 0; i < count; i++) {
    speedLineData.push({
      x: randSide() * rand(3.5, 34),
      y: rand(0.4, 9),
      z: rand(-140, 20),
    });
  }

  speedLines = new THREE.LineSegments(geo, MATERIALS.streak);
  speedLines.frustumCulled = false;
  scene.add(speedLines);
}

function updateSpeedLines(dt, travelled) {
  const speedRatio = Math.abs(physics.currentSpeed) / CONFIG.maxSpeed;
  const opacity = smoothstep(0.5, 1.0, speedRatio) * 0.45;
  MATERIALS.streak.opacity = opacity;
  if (opacity <= 0.001) return;      // nothing to see — skip the buffer update

  const length = 3 + speedRatio * 22;
  const pos = speedLines.geometry.attributes.position.array;

  speedLineData.forEach((line, i) => {
    line.z += travelled * 1.5;
    if (line.z > 25) {
      line.z -= 165;
      line.x = randSide() * rand(3.5, 34);
      line.y = rand(0.4, 9);
    }

    const o = i * 6;
    pos[o]     = line.x; pos[o + 1] = line.y; pos[o + 2] = line.z;
    pos[o + 3] = line.x; pos[o + 4] = line.y; pos[o + 5] = line.z - length;
  });

  speedLines.geometry.attributes.position.needsUpdate = true;
}

/* =========================================================================
   updatePhysics() — arcade driving model, fully delta-time driven
   =========================================================================
   The car never moves along Z. `game.distance` advances instead, and the
   world is rebuilt around it every frame, which keeps every coordinate near
   the origin (stable shadows, no float drift) on a genuinely endless road.
   ========================================================================= */
function updatePhysics(dt) {
  const p = physics;

  // --- Longitudinal: throttle / brake / friction ---
  if (game.state === 'title') {
    // Attract mode: cruise gently past the title card
    p.currentSpeed = THREE.MathUtils.lerp(p.currentSpeed, CONFIG.attractSpeed, 1 - Math.exp(-1.1 * dt));
  } else if (game.state === 'driving' && keys.accelerate) {
    p.currentSpeed += CONFIG.acceleration * dt;
  } else if (game.state === 'driving' && keys.brake) {
    // Brake hard down to a stop, then crawl backwards
    p.currentSpeed -= (p.currentSpeed > 0 ? CONFIG.brakeForce : CONFIG.reverseAccel) * dt;
  } else {
    // Rolling friction plus speed-proportional air drag, pulling toward zero
    // from whichever side the car is on.
    const drag = (CONFIG.friction + Math.abs(p.currentSpeed) * CONFIG.airDrag) * dt;
    p.currentSpeed = p.currentSpeed > 0
      ? Math.max(0, p.currentSpeed - drag)
      : Math.min(0, p.currentSpeed + drag);
  }
  p.currentSpeed = clamp(p.currentSpeed, -CONFIG.maxReverseSpeed, CONFIG.maxSpeed);

  // --- Lane-change steering ---
  // A and D pick a lane (see changeLane()); the car eases across on its own.
  // Crossing still needs speed, so a stopped car stays where it is.
  const speedRatio = Math.abs(p.currentSpeed) / CONFIG.maxSpeed;
  const mobility   = smoothstep(0, CONFIG.laneChangeMinSpeed, speedRatio);
  const prevX      = p.x;

  p.x = THREE.MathUtils.lerp(
    p.x,
    LANE_X[p.targetLane],
    1 - Math.exp(-CONFIG.laneChangeRate * mobility * dt)
  );

  // Corners still throw the car wide before the lane hold reels it back in
  const drift = -curveBend(game.distance) * p.currentSpeed * p.currentSpeed * CONFIG.curveDrift;
  p.x += drift * dt;

  // Everything visual is derived from how fast the car is actually sliding
  p.lateralVel = dt > 0 ? (p.x - prevX) / dt : 0;
  p.heading = clamp(
    Math.atan2(p.lateralVel, Math.max(4, Math.abs(p.currentSpeed))),
    -CONFIG.maxHeading,
    CONFIG.maxHeading
  );

  const forward = Math.cos(p.heading) * p.currentSpeed * dt;

  // --- Clamp to the road ---
  // The lane targets already sit well inside the asphalt; this only catches
  // the drift a hard corner adds.
  const limit = ROAD_HALF + SHOULDER * 0.5 - CAR_HALF_W;
  p.x = clamp(p.x, -limit, limit);

  // --- Advance down the road and score it ---
  game.distance += forward;
  if (game.state === 'driving' && forward > 0) {
    game.score += forward * CONFIG.pointsPerUnit * (1 + speedRatio);
  }

  // --- Apply to the visible car ---
  car.position.x = p.x;
  car.rotation.y = -p.heading;
  car.rotation.z = THREE.MathUtils.lerp(car.rotation.z, p.heading * 0.22, 1 - Math.exp(-8 * dt));

  // Front wheels turn slightly with the steering input
  const targetSteerAngle = -clamp(p.lateralVel * 0.06, -0.55, 0.55);
  const wheelBlend = 1 - Math.exp(-12 * dt);
  frontLeftPivot.rotation.y  = THREE.MathUtils.lerp(frontLeftPivot.rotation.y,  targetSteerAngle, wheelBlend);
  frontRightPivot.rotation.y = THREE.MathUtils.lerp(frontRightPivot.rotation.y, targetSteerAngle, wheelBlend);

  p.wheelSpin += forward / CONFIG.wheelRadius;
  for (const wheel of playerWheels) wheel.rotation.x = p.wheelSpin;

  updateSpeedLines(dt, forward);
  updateSpeedHUD();
}

/* =========================================================================
   updateWorld() — lay the road out along the curve around the player
   ========================================================================= */
function updateWorld() {
  const p = game.distance;
  const originX = curveX(p);

  // Counter-rotate the world so the road under the car always runs straight
  worldGroup.rotation.y = Math.atan(curveSlope(p));

  for (const segment of roadSegments) {
    let rel = segment.userData.roadDist - p;

    // Recycle in both directions (the player can reverse)
    if (rel < -CONFIG.behindCamera) {
      segment.userData.roadDist += TOTAL_ROAD_LEN;
      randomizeSegment(segment);
      rel += TOTAL_ROAD_LEN;
    } else if (rel > TOTAL_ROAD_LEN - CONFIG.behindCamera) {
      segment.userData.roadDist -= TOTAL_ROAD_LEN;
      randomizeSegment(segment);
      rel -= TOTAL_ROAD_LEN;
    }

    const d = segment.userData.roadDist;
    segment.position.set(curveX(d) - originX, 0, -rel);
    segment.rotation.y = -Math.atan(curveSlope(d));

    // Only nearby scenery casts shadows — keeps the shadow pass cheap
    segment.getObjectByName('props').traverse(o => { if (o.isMesh) o.castShadow = rel < 90; });
  }

  for (const t of traffic) {
    const rel = t.roadDist - p;
    const d = t.roadDist;
    const slope = Math.atan(curveSlope(d));
    // Offset the lane position perpendicular to the road heading
    t.group.position.set(curveX(d) - originX + t.laneX * Math.cos(slope), 0, -rel);
    t.group.rotation.y = -slope;
  }
}

/* =========================================================================
   updateCamera() — chase camera, behind and above, smoothly interpolated
   ========================================================================= */
function updateCamera(dt) {
  const speedRatio = Math.abs(physics.currentSpeed) / CONFIG.maxSpeed;

  // The camera's lateral follow lags harder the faster you go, so hard
  // steering swings the view instead of gluing it to the car.
  const lateralBlend = 1 - Math.exp(-CONFIG.camLateralLag * (1 - speedRatio * 0.45) * dt);
  camLateral = THREE.MathUtils.lerp(camLateral, physics.x, lateralBlend);

  _camTarget.set(
    camLateral * 0.75,
    CONFIG.camHeight + speedRatio * 0.35,
    CONFIG.camDistance + speedRatio * 1.8
  );

  // Exponential smoothing — frame-rate independent, unlike a raw lerp factor
  const blend = 1 - Math.exp(-CONFIG.camLerp * dt);
  camera.position.lerp(_camTarget, blend);

  // Screen shake on impact
  if (game.shake > 0.001) {
    camera.position.x += rand(-1, 1) * game.shake;
    camera.position.y += rand(-1, 1) * game.shake * 0.7;
    game.shake *= Math.exp(-3.5 * dt);
  }

  _lookTarget.set(physics.x * 0.4, 1.1, CONFIG.camLookAhead);
  camera.lookAt(_lookTarget);

  const targetFov = CONFIG.baseFov + speedRatio * 10;
  camera.fov += (targetFov - camera.fov) * blend;
  camera.updateProjectionMatrix();
}

/* =========================================================================
   AUDIO — a two-oscillator engine, built with WebAudio only
   =========================================================================
   Must be created from a user gesture, so it starts on the first keypress.
   ========================================================================= */
let audio = null;

function initAudio() {
  if (audio) return;
  const Ctx = window.AudioContext || window.webkitAudioContext;
  if (!Ctx) return;

  const ctx = new Ctx();

  const master = ctx.createGain();
  master.gain.value = 0;
  master.connect(ctx.destination);

  const filter = ctx.createBiquadFilter();
  filter.type = 'lowpass';
  filter.frequency.value = 600;
  filter.Q.value = 5;
  filter.connect(master);

  const osc = ctx.createOscillator();
  osc.type = 'sawtooth';
  osc.frequency.value = 55;
  osc.connect(filter);
  osc.start();

  // A sub-octave square adds the low rumble
  const sub = ctx.createOscillator();
  sub.type = 'square';
  sub.frequency.value = 27;
  const subGain = ctx.createGain();
  subGain.gain.value = 0.35;
  sub.connect(subGain);
  subGain.connect(filter);
  sub.start();

  audio = { ctx, master, filter, osc, sub };
}

/** Maps speed to pitch with five fake gears, so the engine climbs and shifts. */
function currentGear() {
  const ratio = clamp(Math.abs(physics.currentSpeed) / CONFIG.maxSpeed, 0, 0.9999);
  return Math.floor(ratio * 5);
}

function updateAudio() {
  if (!audio) return;

  const t = audio.ctx.currentTime;
  const ratio = clamp(Math.abs(physics.currentSpeed) / CONFIG.maxSpeed, 0, 1);
  const inGear = (ratio * 5) % 1;             // 0..1 within the current gear

  const freq = 46 + inGear * 62 + ratio * 26;
  audio.osc.frequency.setTargetAtTime(freq, t, 0.04);
  audio.sub.frequency.setTargetAtTime(freq * 0.5, t, 0.04);
  audio.filter.frequency.setTargetAtTime(
    380 + ratio * 2400 + (keys.accelerate ? 700 : 0), t, 0.08
  );

  const load = keys.accelerate ? 1.25 : 0.8;
  const silent = muted || game.state === 'over' || game.state === 'title';
  audio.master.gain.setTargetAtTime(silent ? 0 : (0.03 + ratio * 0.07) * load, t, 0.1);

  // Mute the title tune too — but only on change, so the fade-in survives
  if (musicState && !musicState.stopping && musicState.muted !== muted) {
    musicState.muted = muted;
    musicState.bus.gain.cancelScheduledValues(t);
    musicState.bus.gain.setTargetAtTime(muted ? 0.0001 : MUSIC.volume, t, 0.12);
  }
}

function playCrashSound() {
  if (!audio || muted) return;
  const ctx = audio.ctx;

  // A short burst of decaying white noise
  const len = Math.floor(ctx.sampleRate * 0.7);
  const buffer = ctx.createBuffer(1, len, ctx.sampleRate);
  const data = buffer.getChannelData(0);
  for (let i = 0; i < len; i++) {
    const fade = 1 - i / len;
    data[i] = (Math.random() * 2 - 1) * fade * fade;
  }

  const src = ctx.createBufferSource();
  src.buffer = buffer;

  const filter = ctx.createBiquadFilter();
  filter.type = 'lowpass';
  filter.frequency.value = 1400;

  const gain = ctx.createGain();
  gain.gain.value = 0.5;

  src.connect(filter);
  filter.connect(gain);
  gain.connect(ctx.destination);
  src.start();
}

/* =========================================================================
   TITLE MUSIC — a Rob Hubbard style C64 tune, synthesized from scratch
   =========================================================================
   The SID tricks Hubbard leaned on, rebuilt from WebAudio primitives:
   a square-wave bass hammering octave-jumping eighths, a chord "arpeggio"
   cycled at 50 Hz (one note per PAL frame — the SID's way of faking three
   notes out of one voice), a vibrato'd lead with a slapback echo standing
   in for a fourth voice, and noise-burst drums.
   ========================================================================= */
const MUSIC = {
  bpm:        142,
  volume:     0.22,
  stepsPerBar: 16,        // sixteenth notes
  arpRate:    0.02,       // 50 Hz — one arpeggio note per PAL frame
};

// i – VI – VII – i  /  iv – VI – VII – V, in A minor
const CHORDS = [
  { root: 45, minor: true  },   // Am
  { root: 41, minor: false },   // F
  { root: 43, minor: false },   // G
  { root: 45, minor: true  },   // Am
  { root: 38, minor: true  },   // Dm
  { root: 41, minor: false },   // F
  { root: 43, minor: false },   // G
  { root: 40, minor: false },   // E — major, for the harmonic-minor cadence
];

// Bass offsets from the chord root — one per sixteenth, relentless, with the
// octave jumps that carried nearly every SID action tune.
const BASS = [0, 0, 12, 0, 0, 0, 12, 0, 0, 0, 12, 0, 7, 0, 12, 0];

// Lead melody per bar: [step, MIDI note, length in steps].
// Scalar sixteenth runs over the chord, in the style of the era.
const LEAD = [
  [[0, 81, 1], [1, 79, 1], [2, 76, 2], [4, 72, 1], [5, 76, 1], [6, 79, 2],
   [8, 81, 1], [9, 83, 1], [10, 84, 2], [12, 81, 2], [14, 79, 2]],

  [[0, 77, 1], [1, 81, 1], [2, 84, 2], [4, 81, 1], [5, 77, 1], [6, 72, 2],
   [8, 77, 1], [9, 81, 1], [10, 84, 2], [12, 86, 2], [14, 84, 2]],

  [[0, 79, 1], [1, 83, 1], [2, 86, 2], [4, 83, 1], [5, 79, 1], [6, 74, 2],
   [8, 79, 1], [9, 83, 1], [10, 86, 2], [12, 88, 2], [14, 86, 2]],

  [[0, 81, 2], [2, 79, 2], [4, 76, 2], [6, 72, 2],
   [8, 69, 1], [9, 72, 1], [10, 76, 1], [11, 79, 1], [12, 81, 4]],

  [[0, 86, 1], [1, 84, 1], [2, 81, 2], [4, 77, 1], [5, 81, 1], [6, 84, 2],
   [8, 86, 1], [9, 88, 1], [10, 89, 2], [12, 86, 2], [14, 84, 2]],

  [[0, 84, 1], [1, 81, 1], [2, 77, 2], [4, 72, 1], [5, 77, 1], [6, 81, 2],
   [8, 84, 2], [10, 81, 2], [12, 77, 2], [14, 72, 2]],

  [[0, 83, 1], [1, 86, 1], [2, 88, 2], [4, 86, 1], [5, 83, 1], [6, 79, 2],
   [8, 83, 1], [9, 86, 1], [10, 90, 2], [12, 88, 2], [14, 86, 2]],

  [[0, 80, 2], [2, 83, 2], [4, 88, 2], [6, 83, 2], [8, 80, 4], [12, 76, 4]],
];

let musicState = null;
let musicStarted = false;

function midiToFreq(m) { return 440 * Math.pow(2, (m - 69) / 12); }
function stepDuration() { return 60 / MUSIC.bpm / (MUSIC.stepsPerBar / 4); }

/** Root, third and fifth, two octaves up — the notes the arpeggio cycles. */
function chordTones(chord) {
  return [chord.root + 24, chord.root + 24 + (chord.minor ? 3 : 4), chord.root + 31];
}

function startMusic() {
  if (!audio || musicState) return;
  const ctx = audio.ctx;
  const now = ctx.currentTime;

  const bus = ctx.createGain();
  bus.gain.setValueAtTime(0.0001, now);
  bus.gain.exponentialRampToValueAtTime(MUSIC.volume, now + 1.4);
  bus.connect(ctx.destination);

  // Bass voice — filtered to keep it thick rather than buzzy
  const bassBus = ctx.createBiquadFilter();
  bassBus.type = 'lowpass';
  bassBus.frequency.value = 900;
  bassBus.connect(bus);

  // Lead voice, with the slapback echo every C64 musician used to fake a
  // voice they didn't have
  const leadBus = ctx.createGain();
  const delay = ctx.createDelay(1.0);
  delay.delayTime.value = stepDuration() * 1.5;
  const feedback = ctx.createGain();
  feedback.gain.value = 0.3;
  const echoLevel = ctx.createGain();
  echoLevel.gain.value = 0.35;
  delay.connect(feedback);
  feedback.connect(delay);
  delay.connect(echoLevel);
  echoLevel.connect(bus);
  leadBus.connect(bus);
  leadBus.connect(delay);

  // One vibrato LFO, fanned out to every lead note as it's created
  const lfo = ctx.createOscillator();
  lfo.type = 'sine';
  lfo.frequency.value = 5.5;
  const lfoDepth = ctx.createGain();
  lfoDepth.gain.value = 16;          // cents
  lfo.connect(lfoDepth);
  lfo.start();

  // The arpeggio runs as one continuous oscillator; only its frequency is
  // rescheduled, which is exactly how the SID did it (and avoids clicks).
  const arpGain = ctx.createGain();
  arpGain.gain.value = 0.09;
  arpGain.connect(bus);
  const arpOsc = ctx.createOscillator();
  arpOsc.type = 'square';
  arpOsc.connect(arpGain);
  arpOsc.start();

  // Drum noise, generated once
  const noise = ctx.createBuffer(1, Math.floor(ctx.sampleRate * 0.5), ctx.sampleRate);
  const data = noise.getChannelData(0);
  for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;

  musicState = {
    bus, bassBus, leadBus, lfoDepth, lfo, arpOsc, noise,
    step: 0,
    nextTime: now + 0.1,
    stopping: false,
    muted: false,
    timer: setInterval(scheduleMusic, 25),
  };
}

/** Lookahead scheduler: setInterval decides *what*, WebAudio decides *when*. */
function scheduleMusic() {
  if (!musicState || musicState.stopping) return;

  const ctx = audio.ctx;
  const dur = stepDuration();
  const totalSteps = CHORDS.length * MUSIC.stepsPerBar;

  while (musicState.nextTime < ctx.currentTime + 0.15) {
    scheduleStep(musicState.step, musicState.nextTime, dur);
    musicState.nextTime += dur;
    musicState.step = (musicState.step + 1) % totalSteps;
  }
}

function scheduleStep(index, time, dur) {
  const bar   = Math.floor(index / MUSIC.stepsPerBar);
  const step  = index % MUSIC.stepsPerBar;
  const chord = CHORDS[bar];

  // --- Bass: relentless staccato sixteenths ---
  playTone(time, midiToFreq(chord.root + BASS[step]), dur * 0.55,
           'square', 0.42, musicState.bassBus);

  // --- Arpeggio: cycle the chord at 50 Hz ---
  const tones = chordTones(chord);
  let n = 0;
  for (let t = 0; t < dur; t += MUSIC.arpRate) {
    musicState.arpOsc.frequency.setValueAtTime(midiToFreq(tones[n % tones.length]), time + t);
    n++;
  }

  // --- Lead ---
  for (const [at, note, len] of LEAD[bar]) {
    if (at === step) {
      playTone(time, midiToFreq(note), dur * len * 0.9, 'sawtooth', 0.3, musicState.leadBus, true);
    }
  }

  // --- Drums ---
  if (step === 0 || step === 8 || step === 11) playKick(time);
  if (step === 4 || step === 12)               playNoiseHit(time, 0.14, 0.35, 1200);
  if (step % 2 === 1)                          playNoiseHit(time, 0.03, 0.07, 6000);

  // Roll into the top of the loop
  if (bar === CHORDS.length - 1 && step >= 13) playNoiseHit(time, 0.09, 0.3, 1200);
}

function playTone(time, freq, dur, type, vol, dest, vibrato = false) {
  const ctx = audio.ctx;

  const osc = ctx.createOscillator();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, time);
  if (vibrato) musicState.lfoDepth.connect(osc.detune);

  const gain = ctx.createGain();
  gain.gain.setValueAtTime(0.0001, time);
  gain.gain.exponentialRampToValueAtTime(vol, time + 0.006);   // near-instant attack
  gain.gain.exponentialRampToValueAtTime(0.0001, time + dur);

  osc.connect(gain);
  gain.connect(dest);
  osc.start(time);
  osc.stop(time + dur + 0.02);
}

function playKick(time) {
  const ctx = audio.ctx;

  const osc = ctx.createOscillator();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(140, time);
  osc.frequency.exponentialRampToValueAtTime(45, time + 0.11);

  const gain = ctx.createGain();
  gain.gain.setValueAtTime(0.55, time);
  gain.gain.exponentialRampToValueAtTime(0.0001, time + 0.16);

  osc.connect(gain);
  gain.connect(musicState.bus);
  osc.start(time);
  osc.stop(time + 0.18);
}

/** Snare and hi-hat are the same burst with different length and cutoff. */
function playNoiseHit(time, dur, vol, cutoff) {
  const ctx = audio.ctx;

  const src = ctx.createBufferSource();
  src.buffer = musicState.noise;

  const filter = ctx.createBiquadFilter();
  filter.type = 'highpass';
  filter.frequency.value = cutoff;

  const gain = ctx.createGain();
  gain.gain.setValueAtTime(vol, time);
  gain.gain.exponentialRampToValueAtTime(0.0001, time + dur);

  src.connect(filter);
  filter.connect(gain);
  gain.connect(musicState.bus);
  src.start(time);
  src.stop(time + dur + 0.02);
}

function stopMusic() {
  if (!musicState) return;

  const ctx = audio.ctx;
  const s = musicState;
  musicState = null;                 // stops the scheduler immediately

  s.stopping = true;
  clearInterval(s.timer);
  s.bus.gain.cancelScheduledValues(ctx.currentTime);
  s.bus.gain.setValueAtTime(Math.max(s.bus.gain.value, 0.0001), ctx.currentTime);
  s.bus.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.7);

  setTimeout(() => {
    try { s.arpOsc.stop(); s.lfo.stop(); s.bus.disconnect(); } catch (e) { /* already gone */ }
  }, 900);
}

/**
 * Unlocks WebAudio and starts the tune. Browsers only allow audio to begin
 * from a user gesture, so this is called from the first keypress or click.
 * Returns true if this call is what woke the music.
 */
function wakeAudio() {
  initAudio();
  if (!audio || musicStarted || game.state !== 'title') return false;

  musicStarted = true;               // claim it now; the tune follows async
  const begin = () => {
    if (game.state !== 'title') return;
    startMusic();
    ui.titleHint.textContent = 'Press any key to drive';
  };

  if (audio.ctx.state === 'suspended') audio.ctx.resume().then(begin).catch(() => {});
  else begin();

  return true;
}

/* =========================================================================
   GAME STATE — start, crash, restart, scoring
   ========================================================================= */
function startGame() {
  game.state = 'driving';
  game.score = 0;

  physics.x = LANE_X[1];
  physics.targetLane = 1;

  for (const t of traffic) {
    respawnTraffic(t, true);
    t.group.visible = true;
  }

  stopMusic();
  hideHint();          // fades the title card now, the controls hint shortly after
  updateWorld();
}

function crash() {
  if (game.state !== 'driving') return;

  game.state = 'crashing';
  game.crashTimer = 0;
  game.shake = 0.55;
  physics.heading = 0;
  physics.lateralVel = 0;

  ui.vignette.classList.add('show');
  playCrashSound();
}

function restart() {
  physics.currentSpeed = 0;
  physics.heading = 0;
  physics.x = LANE_X[1];
  physics.targetLane = 1;
  physics.lateralVel = 0;

  // game.distance deliberately keeps running: the road segments and traffic
  // are all positioned relative to it, and every run gets a different corner.
  game.score = 0;
  game.timeScale = 1;
  game.shake = 0;
  game.state = 'driving';

  camLateral = 0;
  car.rotation.set(0, 0, 0);

  for (const segment of roadSegments) randomizeSegment(segment);
  for (const t of traffic) respawnTraffic(t, true);

  ui.gameover.classList.remove('show');
  ui.vignette.classList.remove('show');
  ui.newBest.style.display = 'none';

  updateWorld();
}

function updateCrashSequence(dt) {
  game.crashTimer += dt;

  // Ease into slow motion, then hand over to the game-over screen
  game.timeScale = THREE.MathUtils.lerp(game.timeScale, 0.16, 1 - Math.exp(-6 * dt));
  physics.currentSpeed *= Math.exp(-2.5 * dt);

  if (game.crashTimer > 1.3) {
    game.state = 'over';

    const score = Math.floor(game.score);
    const isBest = score > game.best;
    if (isBest) {
      game.best = score;
      localStorage.setItem('endlessDriveBest', String(score));
    }

    ui.finalScore.textContent = 'Score ' + score.toLocaleString();
    ui.finalBest.textContent  = 'Best ' + game.best.toLocaleString();
    ui.newBest.style.display  = isBest ? 'block' : 'none';
    ui.gameover.classList.add('show');
    ui.vignette.classList.remove('show');

    // Don't let the SPACE that was held during the crash restart instantly
    game.awaitingRestartRelease = keys.accelerate;
    updateScoreHUD(true);
  }
}

/* =========================================================================
   HUD
   ========================================================================= */
function updateSpeedHUD() {
  // textContent on a dedicated node, and only when the value actually
  // changes — no innerHTML parsing every frame.
  const kmh = Math.round(Math.abs(physics.currentSpeed) * 3.6);
  if (kmh !== lastKmh) {
    lastKmh = kmh;
    ui.speedNumber.textContent = kmh;
    ui.speedFill.style.width =
      (Math.abs(physics.currentSpeed) / CONFIG.maxSpeed * 100).toFixed(1) + '%';
  }

  const gear = physics.currentSpeed < -0.1 ? -1 : currentGear() + 1;
  if (gear !== lastGear) {
    lastGear = gear;
    ui.gearNumber.textContent = gear === -1 ? 'R' : gear;
  }

  updateScoreHUD(false);
}

function updateScoreHUD(force) {
  const score = Math.floor(game.score);
  if (score !== lastScore || force) {
    lastScore = score;
    ui.score.textContent = score.toLocaleString();
    ui.best.textContent = 'Best ' + game.best.toLocaleString();
  }
}

function flashNearMiss() {
  ui.nearmiss.textContent = 'NEAR MISS +' + CONFIG.nearMissBonus;
  ui.nearmiss.classList.remove('show');
  void ui.nearmiss.offsetWidth;      // restart the CSS animation
  ui.nearmiss.classList.add('show');
}

/* =========================================================================
   animate() — the main loop
   ========================================================================= */
function animate() {
  requestAnimationFrame(animate);

  // Clamp dt so an alt-tab pause can't teleport the car down the road
  const rawDt = Math.min(clock.getDelta(), 0.05);

  if (game.state === 'crashing') updateCrashSequence(rawDt);
  else if (game.state === 'driving') game.timeScale = 1;

  const dt = rawDt * game.timeScale;

  if (game.state !== 'over') {
    updatePhysics(dt);
    updateTraffic(dt);
    updateWorld();
    checkCollisions();
  }

  updateCamera(rawDt);
  updateAudio();

  renderer.render(scene, camera);
}

/* =========================================================================
   INPUT & EVENTS
   ========================================================================= */
/** One tap = one lane. Repeats stack until the car runs out of road. */
function changeLane(direction) {
  if (game.state !== 'driving') return;
  physics.targetLane = clamp(physics.targetLane + direction, 0, CONFIG.laneCount - 1);
}

function onKeyDown(event) {
  // --- Title screen: first press wakes the tune, the next one drives ---
  if (game.state === 'title') {
    if (event.code === 'Space') event.preventDefault();
    if (wakeAudio()) return;      // this press started the music
    startGame();
    return;
  }

  // WebAudio may only start from a user gesture
  initAudio();
  if (audio && audio.ctx.state === 'suspended') audio.ctx.resume();

  switch (event.code) {
    case 'Space':
      event.preventDefault();
      if (game.state === 'over' && !game.awaitingRestartRelease) { restart(); break; }
      keys.accelerate = true;
      hideHint();
      break;

    case 'KeyM':
    case 'ArrowDown':
      keys.brake = true;
      hideHint();
      break;

    case 'KeyA':
    case 'ArrowLeft':
      if (!event.repeat) changeLane(-1);   // held keys shouldn't machine-gun
      hideHint();
      break;

    case 'KeyD':
    case 'ArrowRight':
      if (!event.repeat) changeLane(1);
      hideHint();
      break;

    case 'KeyR':
      if (game.state === 'over') restart();
      break;

    case 'KeyN':
      muted = !muted;
      ui.mutedTag.style.display = muted ? 'block' : 'none';
      break;
  }
}

function onKeyUp(event) {
  switch (event.code) {
    case 'Space':
      keys.accelerate = false;
      game.awaitingRestartRelease = false;
      break;
    case 'KeyM':
    case 'ArrowDown':  keys.brake = false; break;
  }
}

let hintHidden = false;

/** First input dismisses the title card, then the controls hint a beat later. */
function hideHint() {
  if (hintHidden) return;
  hintHidden = true;
  ui.title.classList.add('fade');
  setTimeout(() => ui.hint.classList.add('fade'), 2200);
}

function onResize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
}

/* =========================================================================
   UTILITIES
   ========================================================================= */
function clamp(v, min, max) { return v < min ? min : (v > max ? max : v); }
function rand(min, max)     { return min + Math.random() * (max - min); }
function randSide()         { return Math.random() < 0.5 ? -1 : 1; }

/** Smooth 0..1 ramp between two edges. */
function smoothstep(edge0, edge1, x) {
  const t = clamp((x - edge0) / (edge1 - edge0), 0, 1);
  return t * t * (3 - 2 * t);
}

/* ========================================================================= */
init();
animate();
</script>
